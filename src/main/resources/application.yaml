spring:
  application:
    name: courier-service
  profiles:
    default: dev

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

---
spring:
  config:
    activate:
      on-profile: dev | prod
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8085}
  cloud:
    config:
      label: ${CONFIG_LABEL:develop}
      fail-fast: true
      request-connect-timeout: 2000
      request-read-timeout: 3000
